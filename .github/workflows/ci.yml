name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v2.0.0
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - run: python -c "import sys; print(sys.executable); print(sys.version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run skills:check
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - run: node --test packaging/windows-codex/tests/codex-turn.test.mjs packaging/windows-codex/tests/recall-first.test.mjs
      - run: node --test packaging/windows-codex/tests/npm-distribution.test.mjs
