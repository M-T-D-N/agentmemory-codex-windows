name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -c "import sys; print(sys.executable); print(sys.version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run skills:check
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - run: node packaging/windows-codex/tests/codex-turn.test.mjs
      - run: node --test packaging/windows-codex/tests/npm-distribution.test.mjs
