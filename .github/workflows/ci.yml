name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v2.0.0
        with:
          version: 11.19.0
          runtime: node@24
          cache: true
          install: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - run: python -c "import sys; print(sys.executable); print(sys.version)"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run skills:check
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm test
      - name: Codex adapter synthetic regressions (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $suites = Get-Content -Encoding UTF8 -Raw packaging/windows-codex/test-suites.json | ConvertFrom-Json
          node --test @($suites.adapter)
          exit $LASTEXITCODE
      - name: Packaging and evidence synthetic regressions (Windows PowerShell 5.1)
        shell: powershell
        run: |
          $suites = Get-Content -Encoding UTF8 -Raw packaging/windows-codex/test-suites.json | ConvertFrom-Json
          node --test @($suites.packaging)
          exit $LASTEXITCODE
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
