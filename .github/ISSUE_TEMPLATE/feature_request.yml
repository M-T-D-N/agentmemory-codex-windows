name: Feature request
description: Propose a focused improvement to the Windows/Codex downstream.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
      description: Describe the limitation before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Scope and data impact
      description: Explain effects on Windows, Codex, project scoping, canonical data, providers, or compatibility.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
