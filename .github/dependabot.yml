version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 10
    # Follow upstream AgentMemory's iii-sdk 0.11.2 dependency pin.
    # Review later API lines with upstream and bundled-engine compatibility.
    ignore:
      - dependency-name: iii-sdk
        update-types:
          - version-update:semver-minor
          - version-update:semver-major
    commit-message:
      prefix: deps
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /integrations/openclaw
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(openclaw)
      include: scope

  - package-ecosystem: npm
    directory: /integrations/pi
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(pi)
      include: scope

  - package-ecosystem: npm
    directory: /integrations/filesystem-watcher
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps(fs-watcher)
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci(deps)
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
